# ==================================================
# MySQL
# ==================================================
# 数据库地址
# jdbc:mysql://
# 使用 JDBC 连接 MySQL
# localhost
# MySQL 就运行在当前电脑
# 3306
# MySQL 默认端口
# flashlife
# 项目数据库
# useSSL=false
# 当前本地学习环境暂时不使用 SSL
# allowPublicKeyRetrieval=true
# 允许 MySQL Connector/J
# 在认证过程中获取服务器公钥
# serverTimezone=Asia/Shanghai
# 数据库连接时区
spring.datasource.url=jdbc:mysql://localhost:3306/flashlife?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
# 数据库用户名
# 如果没有 MYSQL_USERNAME 环境变量，
# 默认使用 root
spring.datasource.username=${MYSQL_USERNAME:root}
# 数据库密码
# 从 IDEA 环境变量读取
spring.datasource.password=${MYSQL_PASSWORD}
# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ==================================================
# JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ==================================================
# Refresh Token
# ==================================================
# Refresh Token 生命周期。
# 单位： 天
# 默认： 7 天
auth.refresh-token.expire-days=${REFRESH_TOKEN_EXPIRE_DAYS:7}
# ==================================================
# Redis
# ==================================================
# Redis 服务器地址。
# 本地开发： Redis 就运行在当前电脑。
spring.data.redis.host=${REDIS_HOST:localhost}
# Redis 默认端口： 6379
spring.data.redis.port=${REDIS_PORT:6379}
# Redis Database。
# Redis 默认存在多个逻辑 database。
# Day8 使用：database 0
spring.data.redis.database=${REDIS_DATABASE:0}
# Redis 连接超时时间。
spring.data.redis.timeout=2s
# User Cache
# 正常用户缓存有效时间。 默认： 10 分钟
app.cache.user.ttl-minutes=${USER_CACHE_TTL_MINUTES:10}
# “用户不存在”空值缓存有效时间。
# 默认：60 秒
# 空值缓存不能太久， 避免错误结果长期存在。
app.cache.user.null-ttl-seconds=${USER_CACHE_NULL_TTL_SECONDS:60}
# Day10 - Cache High Concurrency
# 正常 User Cache 的随机 TTL。
# 基础：10 分钟
# 再额外增加： 0 ~ 120 秒
# 最终：600 ~ 720 秒
# 作用：防止大量缓存同一时间过期。
app.cache.user.ttl-jitter-seconds=${USER_CACHE_TTL_JITTER_SECONDS:120}
# 空值缓存也稍微增加随机时间。
# 最终大约：60 ~ 80 秒。
app.cache.user.null-ttl-jitter-seconds=${USER_CACHE_NULL_TTL_JITTER_SECONDS:20}
# Redis Cache Rebuild Lock
# Redis 互斥锁最大生命周期。
# 为什么必须有 TTL？
# 防止拿到锁的 Java 线程突然崩溃，导致锁永远无法释放。
# 当前： 5 秒。
app.cache.user.lock-ttl-seconds=${USER_CACHE_LOCK_TTL_SECONDS:5}
# 没抢到锁以后：等待多少毫秒再检查缓存。
app.cache.user.lock-wait-millis=${USER_CACHE_LOCK_WAIT_MILLIS:50}
# 最多重试次数。
# 20 × 50 ms ≈ 最多等待约 1 秒。
app.cache.user.lock-retry-times=${USER_CACHE_LOCK_RETRY_TIMES:20}
