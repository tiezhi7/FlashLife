# ==================================================
# FlashLife 项目基本配置
# ==================================================

# Spring Boot 应用名称
spring.application.name=flashlife

# Web 服务端口
# 浏览器以后访问 localhost:8080
server.port=8080


# ==================================================
# MySQL 数据库连接
# ==================================================

# jdbc:mysql://
# 表示使用 JDBC 连接 MySQL
#
# localhost
# 表示 MySQL 就在当前电脑
#
# 3306
# 是 MySQL 端口
#
# flashlife
# 是我们刚刚创建的数据库
spring.datasource.url=jdbc:mysql://localhost:3306/flashlife?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8


# 数据库用户名
#
# ${MYSQL_USERNAME:root}
#
# 表示：
# 优先读取 MYSQL_USERNAME 环境变量。
#
# 如果没有设置，
# 默认使用 root。
spring.datasource.username=${MYSQL_USERNAME:root}


# 数据库密码
#
# 不直接把真实密码写进代码。
#
# Spring 会从 MYSQL_PASSWORD
# 环境变量读取。
spring.datasource.password=${MYSQL_PASSWORD}


# MySQL JDBC 驱动
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==================================================
# JPA / Hibernate
# ==================================================

# update：
#
# Hibernate 会根据 Entity
# 和数据库表结构做一定程度同步。
#
# 学习阶段很方便。
#
# 正式生产环境以后不会随便依赖它自动改表。
spring.jpa.hibernate.ddl-auto=update


# 在 IDEA 控制台输出 Hibernate 产生的 SQL
spring.jpa.show-sql=true


# 把 SQL 格式化得更容易阅读
spring.jpa.properties.hibernate.format_sql=true
